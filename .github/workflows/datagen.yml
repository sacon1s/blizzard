# Сбор позиций для обучения сети Blizzard на серверах GitHub (бесплатно для открытых репозиториев).
# Запуск: вкладка Actions → «Сбор позиций» → Run workflow. Каждый сервер играет сам с собой заданное
# число часов, позиции появляются файлами (Artifacts) внизу страницы запуска.
# Оценки позиций: stockfish — Stockfish (последний выпуск, 5000 узлов), blizzard — сам Blizzard.
name: Сбор позиций

on:
  workflow_dispatch:
    inputs:
      machines:
        description: Сколько серверов сразу (1–20)
        default: "8"
      hours:
        description: Часов на каждом сервере (до 5.5)
        default: "5.5"
      labels:
        description: Кто оценивает позиции (stockfish или blizzard)
        default: "stockfish"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.m.outputs.list }}
      hours: ${{ steps.m.outputs.hours }}
      labels: ${{ steps.m.outputs.labels }}
    steps:
      - id: m
        env:
          MACHINES: ${{ inputs.machines }}
          HOURS: ${{ inputs.hours }}
          LABELS: ${{ inputs.labels }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          n = max(1, min(20, int(os.environ["MACHINES"])))
          h = max(0.05, min(5.5, float(os.environ["HOURS"])))
          print("list=" + json.dumps(list(range(1, n + 1))))
          print(f"hours={h}")
          print("labels=" + ("blizzard" if os.environ.get("LABELS", "").strip() == "blizzard" else "stockfish"))
          EOF

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/datagen
      - name: Stockfish
        if: needs.plan.outputs.labels == 'stockfish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sf
          gh release view -R official-stockfish/Stockfish --json tagName,assets --jq '.tagName, .assets[].name' || true
          if gh release download -R official-stockfish/Stockfish -p "stockfish-linux-x86-64-universal*" -D sf || gh release download -R official-stockfish/Stockfish -p "*ubuntu*x86-64-avx2*" -D sf; then
            for f in sf/*; do case "$f" in *.tar) tar -xf "$f" -C sf ;; *.tar.gz|*.tgz) tar -xzf "$f" -C sf ;; *.zip) unzip -q "$f" -d sf ;; esac; done
            SF=$(find sf -type f -name "stockfish*" ! -name "*.tar" ! -name "*.tar.gz" ! -name "*.tgz" ! -name "*.zip" -size +1M | head -1)
          fi
          if [ -z "$SF" ]; then sudo apt-get install -y -q stockfish > /dev/null && SF=/usr/games/stockfish; else SF="$PWD/$SF"; fi
          chmod +x "$SF" 2>/dev/null || true
          echo "SF=$SF" >> "$GITHUB_ENV"
          echo uci | "$SF" | grep "id name"
      - name: Сбор позиций
        env:
          BLZ_SEED: ${{ github.run_id }}${{ matrix.n }}
          HOURS: ${{ needs.plan.outputs.hours }}
          LABELS: ${{ needs.plan.outputs.labels }}
        run: |
          chmod +x tools/datagen/blizzard-data-linux
          if [ "$LABELS" = stockfish ]; then
            tools/datagen/blizzard-data-linux selfplay "$SF" "pos-${{ matrix.n }}" "$HOURS" "$(nproc)" 5000
          else
            tools/datagen/blizzard-data-linux self "pos-${{ matrix.n }}" "$HOURS" "$(nproc)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: positions-${{ needs.plan.outputs.labels == 'stockfish' && 'sf-' || '' }}${{ github.run_id }}-${{ matrix.n }}
          path: pos-*.bin
          retention-days: 14
          if-no-files-found: error
