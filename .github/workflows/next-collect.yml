# Ещё один «Сбор позиций» в ночь на 3 ноября 2026 (12 серверов), как только закончатся текущие.
# Срабатывает только в эту ночь; в другие дни ничего не делает.
name: Следующий сбор

on:
  schedule:
    - cron: "40 0 3 11 *"
    - cron: "10 1 3 11 *"
    - cron: "40 1 3 11 *"
    - cron: "20 2 3 11 *"

permissions:
  actions: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$(date -u +%Y-%m-%d)" != 2026-11-03 ]; then echo "Не та дата"; exit 0; fi
          BUSY=$(gh api "repos/$REPO/actions/workflows/datagen.yml/runs?per_page=30" --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          NEW=$(gh api "repos/$REPO/actions/workflows/datagen.yml/runs?per_page=30&created=%3E%3D2026-11-03" --jq '.total_count')
          if [ "$BUSY" = 0 ] && [ "$NEW" = 0 ]; then
            gh workflow run datagen.yml -R "$REPO" -f machines=12 -f hours=5.5
            echo "Сбор запущен"
          else
            echo "Сбор ещё идёт ($BUSY) или следующий уже запущен ($NEW)"
          fi
